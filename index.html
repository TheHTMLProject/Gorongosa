<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore WildCam Gorongosa camera-trap observations.">
  <title>WildCam Gorongosa Lab | Explore Data</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e492e'/%3E%3Cpath d='M32 12c-8 11-17 19-17 29a17 17 0 0 0 34 0c0-10-9-18-17-29Z' fill='%2397deb0'/%3E%3Ccircle cx='32' cy='39' r='6' fill='%231e492e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="workspace" aria-label="WildCam Gorongosa data explorer">
    <aside class="filters" aria-label="Filters">
      <div class="filter-heading"><h1>Filters</h1><button id="clearFilters" class="text-button" type="button">Clear all</button></div>
      <label class="search"><span class="sr-only">Search species</span><input id="speciesSearch" type="search" placeholder="Search species"></label>
      <details open><summary>Species <span id="speciesCount"></span></summary><div id="speciesFilters" class="options"></div></details>
      <details open><summary>Habitats <span id="habitatCount"></span></summary><div id="habitatFilters" class="options"></div></details>
      <details open><summary>Seasons <span id="seasonCount"></span></summary><div id="seasonFilters" class="options"></div></details>
      <details open><summary>Times of Day <span id="timeCount"></span></summary><div id="timeFilters" class="options"></div></details>
    </aside>
    <div class="results">
      <div class="result-toolbar"><div><strong id="resultCount">Loading observations…</strong><span id="activeSummary">Preparing the data</span></div><button id="download" class="download" type="button" disabled>Export CSV</button></div>
      <section class="map-card" aria-label="Observation map">
        <canvas id="map" width="1200" height="540" role="img" aria-label="Satellite map of Gorongosa with filtered camera trap observations"></canvas>
        <div class="legend"><span><i></i> Filtered camera locations <span id="pointCount"></span></span><span class="attribution">Map tiles © Esri and contributors</span></div>
      </section>
      <section class="records" aria-labelledby="recordHeading"><div class="records-heading"><h2 id="recordHeading">Sample observations</h2><span id="recordNote">Showing the first 80 matches</span></div><div class="table-wrap"><table><thead><tr><th>Species</th><th>Camera</th><th>Habitat</th><th>Season</th><th>Time</th><th>Photo</th></tr></thead><tbody id="tableRows"></tbody></table></div></section>
    </div>
  </main>
  <template id="optionTemplate"><label class="option"><input type="checkbox"><span></span><small></small></label></template>
  <script src="app.js" defer></script>
</body>
</html>
